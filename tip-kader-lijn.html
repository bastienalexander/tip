<h1>Kader · de lijn tekent</h1>
<p class="lead">Richting 01. Eén doorlopende draad begint in de T, trekt het kader rond en eindigt in de L. Daarna worden de letters gestikt, en aan het eind wordt de draad er weer uitgetrokken.</p>
<div class="row"><span class="lab">Kleur</span><span id="themes"></span></div>
<div class="row"><span class="lab">Lijn</span><button id="bStitch">Stiksel</button><button id="bMarch" class="on">Stiksel loopt</button><button id="bNeedle" class="on">Naald</button><span style="width:10px"></span>dikte <input id="w" type="range" min="2" max="14" step=".5" value="6.5"></div>
<div class="row"><span class="lab">Tijd</span><button id="bPlay" class="on">Pauze</button><input id="scrub" type="range" min="0" max="10.4" step=".01" value="0"><span id="t">0.0s</span>
<select id="spd"><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select><button id="bFs">Volledig scherm</button></div>

 <g id="vis" fill="none" mask="url(#m)" stroke-miterlimit="6.91"></g>
 <circle id="needle" r="9"/>

<script>
const NS="http://www.w3.org/2000/svg";
const THEMES=[["Turquoise","#5BBFC0","#fff"],["Wit","#ffffff","#141414"],["Zwart","#141414","#ffffff"],["Indigo","#2433D6","#ffffff"]];
const LOOP=10.4;
let theme=0,stitch=false,march=true,needleOn=true,playing=true,speed=1,w=6.5,t=0,last=null;
// subpaden: elke letter apart, dubbele eruit
let subs=[];
document.querySelectorAll('#src path').forEach(p=>{const row=+p.dataset.row;
 p.getAttribute('d').split(/(?=M)/).forEach(s=>{s=s.trim();if(s)subs.push({d:s,row});});});
const seen=new Set();subs=subs.filter(s=>!seen.has(s.d)&&seen.add(s.d));
subs=subs.filter(s=>{const tail=s.d.replace(/^M[-\d.,]+/,'');return tail.length<15||!subs.some(o=>o!==s&&o.d.length>s.d.length&&o.d.includes(tail));});
const mg=document.getElementById('mg'),vis=document.getElementById('vis'),needle=document.getElementById('needle');
subs.forEach(s=>{s.m=document.createElementNS(NS,'path');s.m.setAttribute('d',s.d);mg.appendChild(s.m);
 s.v=document.createElementNS(NS,'path');s.v.setAttribute('d',s.d);vis.appendChild(s.v);
 s.len=s.m.getTotalLength();s.x=s.m.getBBox().x;});
const hero=subs.reduce((a,b)=>b.len>a.len?b:a);
const letters=subs.filter(s=>s!==hero).sort((a,b)=>a.row-b.row||a.x-b.x);
letters.forEach((s,i)=>{const f=i/(letters.length-1);s.in=2.6+f*2.6;s.out=7.6+f*1.2;});
hero.in=.4;hero.out=8.4;
const ease=x=>x<=0?0:x>=1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const HERO_IN=3.2,LET_IN=1.1,LET_OUT=.8,HERO_OUT=1.6;
function render(){
 const [,bg,fg]=THEMES[theme];
 document.getElementById('bg').setAttribute('fill',bg);
 vis.setAttribute('stroke',fg);vis.setAttribute('stroke-width',w);
 mg.setAttribute('stroke-width',w+6);
 vis.setAttribute('stroke-dasharray',stitch?`${w*2.2} ${w*1.5}`:'none');
 vis.setAttribute('stroke-dashoffset',stitch&&march?-t*40:0);
 needle.setAttribute('fill',fg);needle.setAttribute('r',w*1.3);
 let np=null;
 subs.forEach(s=>{const isH=s===hero,p=ease((t-s.in)/(isH?HERO_IN:LET_IN)),q=ease((t-s.out)/(isH?HERO_OUT:LET_OUT));
  const L=s.len,done=p>=1&&q<=0; // helemaal getekend: geen streepjespatroon meer, zodat begin- en eindpunt op de hoek sluiten
  s.m.setAttribute('stroke-dasharray',done?'none':`${L} ${L+2}`);
  s.m.setAttribute('stroke-dashoffset',q>0?-q*L:L*(1-p));
  if(isH){if(p>0&&p<1)np=s.m.getPointAtLength(p*L);else if(q>0&&q<1)np=s.m.getPointAtLength(q*L);}});
 needle.style.display=needleOn&&np?'':'none';if(np){needle.setAttribute('cx',np.x);needle.setAttribute('cy',np.y);}
 document.getElementById('scrub').value=t;document.getElementById('t').textContent=t.toFixed(1)+'s';}
function loop(ts){if(last!==null&&playing){t=(t+(ts-last)/1000*speed)%LOOP;}last=ts;render();requestAnimationFrame(loop);}
// knoppen
const th=document.getElementById('themes');
THEMES.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x[0];b.className=i===theme?'on':'';b.onclick=()=>{theme=i;th.querySelectorAll('button').forEach((z,j)=>z.classList.toggle('on',j===i));};th.appendChild(b);});
const tg=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>b.classList.toggle('on',fn());};
tg('bStitch',()=>stitch=!stitch);tg('bMarch',()=>march=!march);tg('bNeedle',()=>needleOn=!needleOn);
tg('bPlay',()=>{playing=!playing;document.getElementById('bPlay').textContent=playing?'Pauze':'Afspelen';return playing;});
document.getElementById('scrub').oninput=e=>{t=+e.target.value;};
document.getElementById('spd').onchange=e=>speed=+e.target.value;
document.getElementById('w').oninput=e=>w=+e.target.value;
document.getElementById('bFs').onclick=()=>{const el=document.getElementById('wrap');document.fullscreenElement?document.exitFullscreen():el.requestFullscreen&&el.requestFullscreen();};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('bPlay').click();}});
requestAnimationFrame(loop);
</script><script>if(!document.fullscreenEnabled){const b=document.getElementById("bFs");if(b)b.style.display="none";}</script><script src="tip-ui.js"></script></body></html>
